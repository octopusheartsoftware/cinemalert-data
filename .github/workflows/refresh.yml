# Rebuilds CinemAlert's shared movie list every 6 hours and publishes it on GitHub Pages.
# Also runs on demand (Actions tab → "Refresh movie data" → Run workflow) and whenever its code is pushed.
name: Refresh movie data

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC (off the hour, when GitHub is less busy)
  workflow_dispatch:
  push:                      # also run straight away when the job's own code changes
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # save the updated data file (keeps the scores memory, and counts as repo activity)
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry1.outputs.page_url || steps.deploy_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build movie list
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          COUNTRIES: US
        run: node scripts/fetch-movies.mjs

      - name: Save updated data
        run: |
          git config user.name "cinemalert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh movie data"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data
      # Publishing to GitHub Pages now and then fails on GitHub's side (a "500" server error, or a
      # deployment stuck on "updating_pages"). A normal publish takes under a minute, so give each
      # try 3 minutes, and if it fails, wait and try again before calling the run a failure.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Wait, then retry publishing
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Wait longer, then retry publishing once more
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        run: sleep 180
      - id: deploy_retry2
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
